<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Room Temperature</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">Room Temperature</h1>

        <div class="card">
            <div class="card-body">
                <canvas id="tempChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const temps = {{ temps| tojson }};
        const ctx = document.getElementById('tempChart').getContext('2d');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({ length: temps.length }, (_, i) => i + ":00"),
                datasets: [{
                    label: 'Temperature (°C)',
                    data: temps,
                    fill: true,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    tension: 0.4,
                }]
            },
            options: {
                scales: {
                    y: {
                        suggestedMin: 15,
                        suggestedMax: 30
                    }
                }
            }
        });
    </script>

</body>

</html>
